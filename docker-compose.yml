# Note: This docker-compose.yml is for local testing and reference.
# In production on Coolify, Coolify builds directly from the Dockerfile and Traefik handles routing.
services:
  rapidcorp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

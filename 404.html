<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Page Not Found · Rapid Corp</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#1146a8" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231146a8'/><text x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-family='-apple-system,Segoe UI,Inter,sans-serif' font-weight='800' font-size='18' fill='white'>R</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --primary:#1146a8; --primary-dark:#0c3a8c; --primary-soft:#eaf2ff; --accent:#0aa5a2; --accent-soft:#e3f7f6; --ink:#10233f; --muted:#51627a; --line:#dbe3f1; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:
      radial-gradient(900px 460px at 12% 0%, var(--primary-soft) 0%, rgba(234,242,255,0) 70%),
      radial-gradient(800px 420px at 100% 30%, var(--accent-soft) 0%, rgba(227,247,246,0) 70%),
      #fff;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    padding:24px;
  }
  .card{
    max-width:520px;width:100%;text-align:center;
    background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:48px 36px;
    box-shadow:0 16px 40px rgba(16,35,63,.08);
  }
  .mark{
    width:46px;height:46px;border-radius:10px;
    background:var(--primary);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;letter-spacing:.04em;
    margin-bottom:24px;
    box-shadow:0 6px 14px rgba(17,70,168,.24);
  }
  .code{
    font-size:clamp(64px,9vw,96px);font-weight:700;
    color:var(--primary);line-height:1;letter-spacing:-.04em;
    margin-bottom:8px;font-variant-numeric:tabular-nums;
  }
  h1{font-size:22px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:15px;margin-bottom:28px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;background:var(--primary);color:#fff;
    border-radius:6px;text-decoration:none;font-weight:600;font-size:14px;
    box-shadow:0 6px 14px rgba(17,70,168,.20);
    transition:background .2s,transform .15s ease,box-shadow .2s;
  }
  .btn:hover{background:var(--primary-dark);box-shadow:0 10px 22px rgba(17,70,168,.30);transform:translateY(-1px)}
  .btn i{font-size:11px;transition:transform .25s ease}
  .btn:hover i{transform:translateX(4px)}
  .ghost{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 22px;background:#fff;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;
    text-decoration:none;font-weight:600;font-size:14px;
    margin-left:8px;transition:border-color .2s,color .2s;
  }
  .ghost:hover{border-color:var(--primary);color:var(--primary)}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>
  <main class="card">
    <div class="mark">R</div>
    <div class="code">404</div>
    <h1>This page isn't here.</h1>
    <p>The link you followed may be broken, or the page may have moved. Let's get you back to the homepage.</p>
    <a href="/" class="btn">Back to Home <i class="fa-solid fa-arrow-right"></i></a>
    <a href="/#contact" class="ghost">Contact Us</a>
  </main>
</body>
</html>
